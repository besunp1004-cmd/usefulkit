<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>QA 390px</title>
<style>
  html,body{margin:0;padding:0;background:#fff;font:11px/1.3 monospace}
  iframe{display:block;width:390px;height:940px;border:0}
  #out{position:fixed;left:400px;top:0;width:1400px;background:#fff;white-space:pre-wrap}
</style>
</head>
<body>
<iframe id="a" src="/jeonse-vs-wolse.html?qa=3#jw-sim" title="390px"></iframe>
<pre id="out">measuring</pre>
<script>
(function(){
  var a = document.getElementById('a'), done = false;
  a.addEventListener('load', function(){
    if (done) return; done = true;
    try {
      var doc = a.contentDocument, de = doc.documentElement;
      var l = doc.createElement('link');
      l.rel = 'stylesheet';
      l.href = '/assets/calc.css?cb=' + Date.now();
      doc.head.appendChild(l);
      setTimeout(measure, 900);
    } catch (e) { out('ERR ' + e); }
  });
  function out(s){ document.getElementById('out').textContent = s; }
  function measure(){
    var doc = a.contentDocument, de = doc.documentElement, r = {};
    doc.getElementById('jw-example').click();
    var s = doc.getElementById('jw-simRate');
    s.value = '4.6';
    s.dispatchEvent(new Event('input', {bubbles:true}));
    var bad = [];
    doc.querySelectorAll('.calc-sim,.calc-sim-row,.calc-sim-top,.calc-sim-live,.calc-sim-reset,.calc-res,.calc-res-grid,.calc-summary,.calc-card,.calc-actions').forEach(function(el){
      if (el.scrollWidth > el.clientWidth + 1) bad.push((el.className||el.tagName)+':'+el.scrollWidth+'>'+el.clientWidth);
    });
    r.viewport = de.clientWidth; r.docScrollW = de.scrollWidth;
    r.hScroll = de.scrollWidth > de.clientWidth;
    r.overflow = bad;
    var rr = doc.getElementById('jw-simRate').getBoundingClientRect();
    r.sliderW = Math.round(rr.width); r.sliderH = Math.round(rr.height);
    r.pct = doc.getElementById('jw-simRate').style.getPropertyValue('--pct');
    r.simRect = {x: Math.round(doc.getElementById('jw-sim').getBoundingClientRect().x), y: Math.round(doc.getElementById('jw-sim').getBoundingClientRect().y)};
    r.rate = doc.getElementById('jw-simRateOut').textContent;
    r.share = doc.getElementById('jw-simShare').value;
    r.state = doc.getElementById('jw-simState').textContent;
    r.windowScrollY = Math.round(doc.documentElement.scrollTop || doc.body.scrollTop);
    out('RESULT ' + JSON.stringify(r));
  }
})();
</script>
</body>
</html>
