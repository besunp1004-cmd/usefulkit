<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA 390px harness</title>
<style>
  body{margin:0;background:#222;color:#fff;font:13px/1.5 monospace}
  #wrap{width:390px;overflow:hidden}
  iframe{width:390px;height:1600px;border:0;display:block;background:#fff}
  #qa-out{white-space:pre-wrap;padding:8px;background:#000;color:#0f0;width:390px}
</style>
</head>
<body>
<div id="wrap"><iframe id="f" src="/jeonse-vs-wolse.html"></iframe></div>
<div id="qa-out">waiting…</div>
<script>
var f = document.getElementById('f');
f.addEventListener('load', function(){
  try {
    var d = f.contentDocument, w = f.contentWindow;
    function set(id, v){ var n = d.getElementById(id); n.value = v; n.dispatchEvent(new w.Event('input', {bubbles:true})); }
    set('jw-jDeposit', '600000'); set('jw-jLoan', '420000'); set('jw-jRate', '3.4'); set('jw-jYield', '3.5');
    set('jw-wDeposit', '50000'); set('jw-wRent', '160'); set('jw-jMaint', '35'); set('jw-wMaint', '12');
    d.getElementById('jw-detailBox').open = true;
    setTimeout(function(){
      var q = function(s){ return d.querySelector(s); };
      var wid = function(el){ return el ? Math.round(el.getBoundingClientRect().width) : -1; };
      var over = [];
      var all = d.querySelectorAll('main *');
      for (var i = 0; i < all.length; i++){
        var e = all[i];
        if (e.clientWidth > 0 && e.scrollWidth > e.clientWidth + 1) over.push(e.tagName + '.' + (e.className || '') + ' ' + e.clientWidth + '->' + e.scrollWidth);
      }
      var out = [
        'innerWidth=' + w.innerWidth,
        'docScrollWidth=' + d.documentElement.scrollWidth,
        'docHorizontalOverflow=' + (d.documentElement.scrollWidth > w.innerWidth + 1),
        'detailBodyWidth=' + wid(q('#jw-detailBody')),
        'detailTableWidth=' + wid(q('#jw-detailBody table')),
        'summaryWidth=' + wid(q('#jw-summary')),
        'horizonWidth=' + wid(q('#jw-horizon')),
        'horizonText=' + (q('#jw-horizon') ? q('#jw-horizon').textContent.slice(0, 90) : ''),
        'verdict=' + (q('#jw-verdict') ? q('#jw-verdict').textContent.slice(0, 130) : ''),
        'summaryText=' + (q('#jw-summary') ? q('#jw-summary').textContent.replace(/\s+/g, ' ').slice(0, 300) : ''),
        'sliderRect=' + JSON.stringify(q('#jw-simRate').getBoundingClientRect().toJSON()),
        'overflowingElements=' + over.length,
        over.slice(0, 6).join(' | ')
      ].join('\n');
      document.getElementById('qa-out').textContent = out;
      q('#jw-verdict').scrollIntoView({block: 'start'});
    }, 400);
  } catch (e) {
    document.getElementById('qa-out').textContent = 'ERR ' + e.message;
  }
});
</script>
</body>
</html>
